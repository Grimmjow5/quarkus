quarkus.datasource.devservices.enabled=false

quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=postgres
quarkus.datasource.password=123456
quarkus.datasource.jdbc.url=jdbc:postgresql://127.0.0.2:5432/accesos
quarkus.datasource.jdbc.max-size=16

# access token corto: si lo roban, la ventana de daño es mínima
app.jwt.access-token.duration=PT10M
# refresh token largo, pero revocable en BD
app.jwt.refresh-token.duration=P7D

mp.jwt.verify.publickey.location=publickey.pem 
mp.jwt.verify.issuer=http://localhost:8080

smallrye.jwt.sign.key.location=rsaPrivatekey.pem 

# Apaga el auto-DDL de Hibernate por completo
quarkus.hibernate-orm.database.generation=drop-and-create

# Flyway
#dev.quarkus.flyway.clean-at-start=true
quarkus.flyway.migrate-at-start=true
quarkus.flyway.baseline-on-migrate=true
quarkus.flyway.locations=classpath:db/migration
